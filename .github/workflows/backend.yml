name: Backend CI/CD

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage
          - prod

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  containerize:
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TARGET_ENV: ${{ github.event.inputs.environment }}
      ECR_REPOSITORY: rizourafoods/${{ github.event.inputs.environment }}/backend
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        name: Define image tag
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        working-directory: backend
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA} .
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: containerize
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TARGET_ENV: ${{ github.event.inputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger EC2 rolling restart via SSM
        run: |
          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/rizourafoods/${TARGET_ENV}/backend:${{ needs.containerize.outputs.image_tag }}"
          REGISTRY_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          COMMANDS=$(jq -cn \
            --arg region "${AWS_REGION}" \
            --arg registry "${REGISTRY_URI}" \
            --arg image "${IMAGE_URI}" \
            --arg log_group "/aws/rizourafoods/${TARGET_ENV}/api" \
            '[
              "set -euo pipefail",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
              "docker pull \($image)",
              "docker rm -f rizourafoods-api || true",
              "docker run -d --name rizourafoods-api --restart unless-stopped --env-file /opt/rizourafoods/.env --log-driver awslogs --log-opt awslogs-region=\($region) --log-opt awslogs-group=\($log_group) --log-opt awslogs-stream=$(hostname)-api -p 3000:3000 \($image) sh -c \"npx prisma migrate deploy && node dist/server.js\""
            ]')

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Rizoura Foods API image ${{ needs.containerize.outputs.image_tag }}" \
            --targets "Key=tag:Application,Values=rizourafoods-api" "Key=tag:Environment,Values=${TARGET_ENV}" \
            --parameters "commands=${COMMANDS}"
